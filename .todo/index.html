<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理アプリ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: #f2f4f7;
    color: #1f2430;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #4f7cff;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .add-btn {
    background: #4f7cff;
    color: #fff;
    padding: 10px 18px;
  }
  .add-btn:hover { background: #3d68ec; }
  .add-btn:disabled {
    background: #b9c6e6;
    cursor: not-allowed;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eef0f4;
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  li span {
    flex: 1;
    font-size: 14px;
    word-break: break-word;
  }
  li.done span {
    text-decoration: line-through;
    color: #9aa1ac;
  }
  .delete-btn {
    background: transparent;
    color: #d92d20;
    padding: 6px 8px;
    font-size: 13px;
  }
  .delete-btn:hover { background: #fde8e6; }
  .empty {
    text-align: center;
    color: #9aa1ac;
    font-size: 14px;
    padding: 24px 0;
  }
  .summary {
    margin-top: 16px;
    font-size: 12px;
    color: #9aa1ac;
    text-align: right;
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<script type="text/babel">
const { useState } = React;

const STORAGE_KEY = "todo-app-tasks";

function loadTasks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveTasks(tasks) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (e) {}
}

function App() {
  const [tasks, setTasks] = useState(loadTasks);
  const [text, setText] = useState("");

  const updateTasks = (next) => {
    setTasks(next);
    saveTasks(next);
  };

  const addTask = (e) => {
    e.preventDefault();
    const trimmed = text.trim();
    if (!trimmed) return;
    const newTask = { id: Date.now(), text: trimmed, done: false };
    updateTasks([...tasks, newTask]);
    setText("");
  };

  const toggleTask = (id) => {
    updateTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
  };

  const deleteTask = (id) => {
    updateTasks(tasks.filter(t => t.id !== id));
  };

  const remaining = tasks.filter(t => !t.done).length;

  return (
    <div className="app">
      <h1>タスク管理アプリ</h1>
      <form onSubmit={addTask}>
        <input
          type="text"
          placeholder="新しいタスクを入力"
          value={text}
          onChange={(e) => setText(e.target.value)}
        />
        <button type="submit" className="add-btn" disabled={!text.trim()}>追加</button>
      </form>

      {tasks.length === 0 ? (
        <div className="empty">タスクはありません</div>
      ) : (
        <ul>
          {tasks.map(task => (
            <li key={task.id} className={task.done ? "done" : ""}>
              <input
                type="checkbox"
                checked={task.done}
                onChange={() => toggleTask(task.id)}
              />
              <span>{task.text}</span>
              <button className="delete-btn" onClick={() => deleteTask(task.id)}>削除</button>
            </li>
          ))}
        </ul>
      )}

      {tasks.length > 0 && (
        <div className="summary">残り {remaining} / 全 {tasks.length} 件</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
