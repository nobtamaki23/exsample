<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落ちものパズル</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
  }
  #game-container {
    position: relative;
    text-align: center;
  }
  h1 {
    color: #eee;
    font-size: 20px;
    margin: 0 0 10px;
  }
  canvas {
    background: #0f0f1e;
    border: 4px solid #444;
    display: block;
    margin: 0 auto;
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    color: #fff;
  }
  #overlay.show {
    display: flex;
  }
  #overlay p {
    font-size: 28px;
    margin: 0 0 16px;
    color: #ff5566;
  }
  #restart-btn {
    padding: 8px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #4caf50;
    color: #fff;
    border: none;
    border-radius: 4px;
  }
  #restart-btn:hover {
    background: #43a047;
  }
  #hint {
    color: #aaa;
    font-size: 13px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="game-container">
  <h1>落ちものパズル</h1>
  <canvas id="board" width="240" height="480"></canvas>
  <div id="overlay">
    <p>GAME OVER</p>
    <button id="restart-btn">リスタート</button>
  </div>
  <p id="hint">← → : 移動 / ↑ : 回転 / ↓ : ソフトドロップ</p>
</div>

<script>
(function () {
  const COLS = 10;
  const ROWS = 20;
  const BLOCK = 24;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const restartBtn = document.getElementById('restart-btn');

  const COLORS = {
    I: '#00e0e0',
    O: '#e0e000',
    T: '#a000e0',
    S: '#00e000',
    Z: '#e00000',
    J: '#0000e0',
    L: '#e08000'
  };

  // 各ピースの回転パターン (4方向) を座標のリストで定義
  const SHAPES = {
    I: [
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]]
    ],
    O: [
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]]
    ],
    T: [
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]]
    ],
    S: [
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]]
    ],
    Z: [
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]]
    ],
    J: [
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]]
    ],
    L: [
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]]
    ]
  };

  const PIECE_NAMES = Object.keys(SHAPES);

  let field = createField();
  let current = null;
  let dropTimer = 0;
  let dropInterval = 600; // ms
  let lastTime = 0;
  let gameOver = false;
  let animationId = null;

  function createField() {
    const f = [];
    for (let r = 0; r < ROWS; r++) {
      f.push(new Array(COLS).fill(null));
    }
    return f;
  }

  function randomPiece() {
    const name = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
    return {
      name: name,
      rotation: 0,
      x: 0,
      y: 0,
      color: COLORS[name]
    };
  }

  function getCells(piece) {
    return SHAPES[piece.name][piece.rotation].map(([cx, cy]) => [piece.x + cx, piece.y + cy]);
  }

  function collides(piece, offsetX, offsetY, rotation) {
    const testPiece = {
      name: piece.name,
      rotation: rotation,
      x: piece.x + offsetX,
      y: piece.y + offsetY
    };
    const cells = getCells(testPiece);
    for (const [x, y] of cells) {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && field[y][x]) return true;
    }
    return false;
  }

  function spawnPiece() {
    const piece = randomPiece();
    piece.x = Math.floor(COLS / 2) - 2;
    piece.y = -1;
    if (collides(piece, 0, 0, piece.rotation)) {
      endGame();
      return null;
    }
    return piece;
  }

  function lockPiece() {
    const cells = getCells(current);
    for (const [x, y] of cells) {
      if (y >= 0) field[y][x] = current.color;
    }
    clearLines();
    current = spawnPiece();
  }

  function clearLines() {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (field[r].every(cell => cell !== null)) {
        field.splice(r, 1);
        field.unshift(new Array(COLS).fill(null));
        r++; // 同じ行をもう一度チェック
      }
    }
  }

  function tryMove(dx, dy) {
    if (!current || gameOver) return false;
    if (!collides(current, dx, dy, current.rotation)) {
      current.x += dx;
      current.y += dy;
      return true;
    }
    return false;
  }

  function tryRotate() {
    if (!current || gameOver) return;
    const newRotation = (current.rotation + 1) % 4;
    // 単純な壁蹴り: そのまま/右/左にずらして試す
    const kicks = [0, 1, -1, 2, -2];
    for (const k of kicks) {
      if (!collides(current, k, 0, newRotation)) {
        current.x += k;
        current.rotation = newRotation;
        return;
      }
    }
  }

  function softDrop() {
    if (!tryMove(0, 1)) {
      lockPiece();
    }
    dropTimer = 0;
  }

  function endGame() {
    gameOver = true;
    overlay.classList.add('show');
  }

  function resetGame() {
    field = createField();
    gameOver = false;
    dropTimer = 0;
    overlay.classList.remove('show');
    current = spawnPiece();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 固定済みブロック
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (field[r][c]) {
          drawBlock(c, r, field[r][c]);
        }
      }
    }

    // 落下中のピース
    if (current) {
      const cells = getCells(current);
      for (const [x, y] of cells) {
        if (y >= 0) drawBlock(x, y, current.color);
      }
    }

    // グリッド線
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * BLOCK, 0);
      ctx.lineTo(c * BLOCK, ROWS * BLOCK);
      ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * BLOCK);
      ctx.lineTo(COLS * BLOCK, r * BLOCK);
      ctx.stroke();
    }
  }

  function drawBlock(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.strokeRect(x * BLOCK + 0.5, y * BLOCK + 0.5, BLOCK - 1, BLOCK - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, 4);
  }

  function loop(time) {
    if (!lastTime) lastTime = time;
    const delta = time - lastTime;
    lastTime = time;

    if (!gameOver) {
      dropTimer += delta;
      if (dropTimer > dropInterval) {
        if (!tryMove(0, 1)) {
          lockPiece();
        }
        dropTimer = 0;
      }
      draw();
    }

    animationId = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    if (gameOver) return;
    switch (e.key) {
      case 'ArrowLeft':
        e.preventDefault();
        tryMove(-1, 0);
        break;
      case 'ArrowRight':
        e.preventDefault();
        tryMove(1, 0);
        break;
      case 'ArrowDown':
        e.preventDefault();
        softDrop();
        break;
      case 'ArrowUp':
        e.preventDefault();
        tryRotate();
        break;
    }
  });

  restartBtn.addEventListener('click', resetGame);

  resetGame();
  animationId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
